[project]
name = "leadscraper"
version = "0.1.0"
description = "Pakistan local business lead scraper — see implementation.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "rq>=2.0",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "phonenumbers>=8.13.50",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2+. Kept out of the base install so Phase 1 sets up in seconds —
# `uv sync --extra browser` then `playwright install chromium` when you need it.
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Autogenerated by Alembic — reformatting it produces noisy diffs on every
# `revision --autogenerate` and gains nothing.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["leadscraper"]
mypy_path = "src"
ignore_missing_imports = true
