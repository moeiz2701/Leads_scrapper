# §4.2 Query expansion dictionary — the highest-leverage config file here.
#
# Google Maps caps a single query at ~120 results, so volume comes from synonym
# fan-out. In Pakistan that means local and transliterated terms, not just the
# English ones: "hajaam" and "darzi" surface listings that "barber" and "tailor"
# never reach.
#
# queries_per_run = len(commercial_tiles) x len(synonyms[category])
# Adding a synonym multiplies your query count by tiles — measure yield per
# synonym after the first validation run (§16) and drop the dead ones.

