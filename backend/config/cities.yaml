# §3.1 cities, each with the §5.1 commercial tiles that make volume achievable.
#
# A tile is a commercial district you run the full synonym set against. Tiling
# is what gets you past the ~120-result cap on a single Maps query:
#   12 tiles x 5 synonyms = 60 queries -> ~2,400 raw -> ~700 unique
#
# Only Lahore's tiles are given in implementation.md (§5.1). The rest are a
# starting set drawn from each city's main commercial areas — treat them as a
# hypothesis to tune, not ground truth. After a validation run, drop tiles that
# returned nothing and split any tile that hit the result cap.

